[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "personal-smart-ocr-mcp"
version = "1.0.0"
description = "MCP tools, resources and workflows for Smart Document Manager"
requires-python = ">=3.11"
# LICENSE is a copy of the repository's LICENSE (tests/test_third_party_notices.py).
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "httpx==0.28.1",
    # GHSA-6q48-6c7w-9gw2: certifi bundles emSign roots with compromised intermediates.
    "certifi==2026.10.19",
    "starlette==1.9.0",
    "python-multipart==0.0.32",
    "pydantic==2.13.4",
    "pydantic-settings==2.9.1",
    "jsonschema==4.26.0",
    "uvicorn[standard]==0.49.0",
    "pywin32>=311; sys_platform == 'win32'",
]

[project.scripts]
ocr-mcp = "ocr_mcp.__main__:main"

[tool.hatch.build]
# Parent VCS ignore rules must not strip published MCP documents from builds.
artifacts = [
    "ocr_mcp/resources/docs/*.md",
    "ocr_mcp/resources/docs/guide/*.html",
]

[tool.hatch.build.targets.wheel]
packages = ["ocr_mcp"]
