<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" fill="none" role="img" aria-labelledby="sdm-stack-title sdm-stack-desc">
  <title id="sdm-stack-title">Smart Document Manager — stack architecture</title>
  <desc id="sdm-stack-desc">Applications and the built-in web console call the Smart Document Manager FastAPI service over REST on port 8020. AI agents reach the same API through the optional MCP server on port 8021, which exposes 14 tools, 11 resources, and 3 workflow prompts. The API converts Office documents, rasterizes PDFs, runs layout analysis and dispatches visual recognition to the GPU-backed vLLM PaddleOCR-VL model server, or performs deterministic CPU RAG chunking with the local tokenizer. When the optional storage profile is enabled, outputs are archived to SeaweedFS S3 through the storage gateway on port 8333.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d182a"/>
      <stop offset="1" stop-color="#070e1a"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(510 466) rotate(90) scale(330 550)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2468b6" stop-opacity=".15"/>
      <stop offset="1" stop-color="#2468b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="api-fill" x1="76" y1="442" x2="744" y2="550" gradientUnits="userSpaceOnUse">
      <stop stop-color="#163f71"/>
      <stop offset="1" stop-color="#102944"/>
    </linearGradient>
    <linearGradient id="api-stroke" x1="76" y1="442" x2="744" y2="550" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6cb5ff"/>
      <stop offset=".55" stop-color="#3581ce"/>
      <stop offset="1" stop-color="#264e76"/>
    </linearGradient>
    <linearGradient id="mcp-fill" x1="434" y1="318" x2="744" y2="398" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17375d"/>
      <stop offset="1" stop-color="#11223a"/>
    </linearGradient>
    <linearGradient id="mcp-stroke" x1="434" y1="318" x2="744" y2="398" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5ea6f2"/>
      <stop offset=".6" stop-color="#3a76b4"/>
      <stop offset="1" stop-color="#2a4f78"/>
    </linearGradient>
    <linearGradient id="vllm-fill" x1="76" y1="602" x2="744" y2="708" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17375d"/>
      <stop offset="1" stop-color="#0f2135"/>
    </linearGradient>
    <linearGradient id="vllm-stroke" x1="76" y1="602" x2="744" y2="708" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5ea6f2"/>
      <stop offset=".6" stop-color="#3a76b4"/>
      <stop offset="1" stop-color="#294a70"/>
    </linearGradient>
    <linearGradient id="entry-fill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#144c4b"/>
      <stop offset="1" stop-color="#0e2630"/>
    </linearGradient>
    <linearGradient id="entry-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4fd3c4"/>
      <stop offset=".6" stop-color="#2f8f88"/>
      <stop offset="1" stop-color="#24605e"/>
    </linearGradient>
    <linearGradient id="storage-fill" x1="846" y1="442" x2="1160" y2="662" gradientUnits="userSpaceOnUse">
      <stop stop-color="#331624"/>
      <stop offset="1" stop-color="#1b0e17"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".75" fill="#a0badc" fill-opacity=".10"/>
    </pattern>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" stroke="#7bb9fb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="browser-icon" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="24" height="20" rx="4"/>
      <path d="M2 10h24m-19-3h.01m4 0h.01m0 8-3 3 3 3m6-6 3 3-3 3"/>
    </g>
    <g id="agent-icon" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="20" height="16" rx="5"/>
      <path d="M14 4v4M1 14v5m26-5v5M10 19h8"/>
      <circle cx="10" cy="14" r="1" fill="currentColor" stroke="none"/>
      <circle cx="18" cy="14" r="1" fill="currentColor" stroke="none"/>
      <circle cx="14" cy="3" r="1.5"/>
    </g>
    <g id="bridge-icon" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 7-6 7 6 7m10-14 6 7-6 7m-3-16-4 20"/>
    </g>
    <g id="api-icon" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m14 3 12 7-12 7L2 10l12-7ZM2 16l12 7 12-7M2 22l12 7 12-7"/>
    </g>
    <g id="chip-icon" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="18" height="18" rx="4"/>
      <rect x="11" y="11" width="8" height="8" rx="2"/>
      <path d="M10 2v4m10-4v4M10 24v4m10-4v4M2 10h4m-4 10h4m18-10h4m-4 10h4"/>
    </g>
    <g id="database-icon" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="15" cy="7" rx="12" ry="5"/>
      <path d="M3 7v16c0 2.8 5.4 5 12 5s12-2.2 12-5V7M3 15c0 2.8 5.4 5 12 5s12-2.2 12-5"/>
    </g>
    <g id="step-arrow" stroke="#55708f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0h21m-5-5 5 5-5 5"/>
    </g>
  </defs>

  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .heading { fill: #f0f6ff; font-weight: 600; }
    .body { fill: #b4c6de; font-size: 15px; }
    .small { fill: #94acc8; font-size: 13px; }
    .eyebrow { fill: #91abc9; font-size: 11px; font-weight: 600; letter-spacing: 1.6px; }
    .mono { font-family: Consolas, "Liberation Mono", monospace; font-size: 12px; }
    .blue { fill: #8bc5ff; }
    .rose { fill: #ff8fa3; }
    .connector { stroke: #7bb9fb; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Self-contained artwork: no remote assets, fonts, or scripts. -->
  <rect x=".5" y=".5" width="1199" height="849" rx="24" fill="url(#background)" stroke="#24364e"/>
  <rect x="24" y="156" width="1152" height="580" rx="20" fill="url(#dots)"/>
  <rect x="24" y="156" width="1152" height="580" rx="20" fill="url(#ambient)"/>

  <!-- Product identity. -->
  <text x="410" y="44" text-anchor="middle" class="eyebrow" style="fill: #8bc5ff">SMART DOCUMENT MANAGER</text>
  <text x="410" y="96" text-anchor="middle" class="heading" font-size="40" letter-spacing="-.9">One stack. Document intelligence &amp; RAG.</text>
  <text x="410" y="128" text-anchor="middle" class="body" style="font-size: 17px">Local VLM OCR, deterministic RAG chunking, and a direct path for apps and agents.</text>
  <!-- The SDM logo, inlined from assets/logo.svg (keep the two in step). -->
  <g transform="translate(1100 36) scale(.46)">
    <defs>
      <radialGradient id="sdm-disc" gradientUnits="userSpaceOnUse" cx="64" cy="141" r="108">
        <stop offset="0" stop-color="#14424c"/>
        <stop offset=".7" stop-color="#07080d"/>
      </radialGradient>
      <linearGradient id="sdm-back" gradientUnits="userSpaceOnUse" x1="0" y1="25.35" x2="0" y2="89.49">
        <stop offset="0" stop-color="#a078ff"/>
        <stop offset="1" stop-color="#7853db"/>
      </linearGradient>
      <linearGradient id="sdm-ring" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="128">
        <stop offset="0" stop-color="#a078ff"/>
        <stop offset="1" stop-color="#7853db"/>
      </linearGradient>
      <linearGradient id="sdm-front" gradientUnits="userSpaceOnUse" x1="0" y1="38.51" x2="0" y2="102.65">
        <stop offset="0" stop-color="#29e6ff"/>
        <stop offset="1" stop-color="#52a8ff"/>
      </linearGradient>
      <clipPath id="sdm-clip"><circle cx="64" cy="64" r="64"/></clipPath>
      <filter id="sdm-blur" filterUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
        <feGaussianBlur stdDeviation="3.2"/>
      </filter>
      <path id="sdm-sheet-back" d="M37.69 30.29H64L77.16 43.44V84.56H37.69Z"/>
      <path id="sdm-sheet-front" d="M50.84 43.44H77.16L90.31 56.6V97.71H50.84Z"/>
    </defs>
    <circle cx="64" cy="64" r="64" fill="url(#sdm-disc)"/>
    <circle cx="64" cy="64" r="62" fill="none" stroke="url(#sdm-ring)" stroke-width="4"/>
    <g clip-path="url(#sdm-clip)" fill="none" stroke-width="10.47" stroke-linecap="round" stroke-linejoin="round">
      <use href="#sdm-sheet-back" stroke="url(#sdm-back)" filter="url(#sdm-blur)" opacity=".5"/>
      <use href="#sdm-sheet-back" stroke="url(#sdm-back)"/>
      <use href="#sdm-sheet-front" stroke="url(#sdm-front)" filter="url(#sdm-blur)" opacity=".5"/>
      <use href="#sdm-sheet-front" fill="url(#sdm-disc)"/>
      <use href="#sdm-sheet-front" stroke="url(#sdm-front)"/>
      <path d="M77.16 43.44V56.6H90.31M62.36 71.4H78.8M62.36 84.56H70.58" stroke="url(#sdm-front)"/>
    </g>
  </g>

  <!-- The boundary contains the core services managed by this project. -->
  <rect x="40" y="286" width="740" height="450" rx="20" fill="#101e31" fill-opacity=".62" stroke="#344c69" stroke-dasharray="4 7"/>
  <text x="64" y="312" class="eyebrow">SDM DOCKER STACK</text>

  <!-- Calls flow downward; optional S3 storage connects to the right. -->
  <path d="M231 252V435" class="connector" marker-end="url(#arrow-blue)"/>
  <path d="M589 252V311" class="connector" marker-end="url(#arrow-blue)"/>
  <path d="M589 398V435" class="connector" marker-end="url(#arrow-blue)"/>
  <path d="M410 550V595" class="connector" marker-end="url(#arrow-blue)"/>
  <path d="M744 496H839" class="connector" marker-end="url(#arrow-blue)"/>

  <rect x="245" y="350" width="51" height="25" rx="7" fill="#13263d"/>
  <text x="270.5" y="367" text-anchor="middle" class="mono blue">REST</text>
  <rect x="599" y="273.5" width="116" height="25" rx="7" fill="#13263d"/>
  <text x="657" y="291" text-anchor="middle" class="small blue">MCP over HTTP</text>
  <rect x="599" y="408" width="51" height="25" rx="7" fill="#13263d"/>
  <text x="624.5" y="425" text-anchor="middle" class="mono blue">REST</text>
  <rect x="421" y="564" width="126" height="25" rx="7" fill="#13263d"/>
  <text x="484" y="581" text-anchor="middle" class="small blue">OpenAI /v1 VLM</text>
  <rect x="756" y="464" width="76" height="25" rx="7" fill="#13263d"/>
  <text x="794" y="481" text-anchor="middle" class="mono blue">archive</text>
  <rect x="756" y="501" width="76" height="25" rx="7" fill="#13263d"/>
  <text x="794" y="518" text-anchor="middle" class="mono blue">+ browse</text>

  <!-- Entry points. -->
  <rect x="76" y="174" width="310" height="78" rx="14" fill="url(#entry-fill)" stroke="url(#entry-stroke)" stroke-width="1.2"/>
  <rect x="92" y="191" width="44" height="44" rx="12" fill="#1b5753"/>
  <use href="#browser-icon" x="100" y="199" color="#b9f2e8"/>
  <text x="151" y="206" class="heading" font-size="21">Your application</text>
  <text x="151" y="230" class="small" style="fill: #9fc9c5">Web console + HTTP client</text>

  <rect x="434" y="174" width="310" height="78" rx="14" fill="url(#entry-fill)" stroke="url(#entry-stroke)" stroke-width="1.2"/>
  <rect x="450" y="191" width="44" height="44" rx="12" fill="#1b5753"/>
  <use href="#agent-icon" x="458" y="198" color="#b9f2e8"/>
  <text x="509" y="206" class="heading" font-size="21">Your AI agent</text>
  <text x="509" y="230" class="small" style="fill: #9fc9c5">MCP client + OCR skills</text>

  <!-- Optional MCP translation layer. -->
  <rect x="430" y="314" width="318" height="88" rx="18" stroke="#4b9af0" stroke-opacity=".10" stroke-width="7"/>
  <rect x="434" y="318" width="310" height="80" rx="14" fill="url(#mcp-fill)" stroke="url(#mcp-stroke)" stroke-width="1.2"/>
  <use href="#bridge-icon" x="452" y="331" color="#bcd9ff"/>
  <text x="492" y="352" class="heading" font-size="21">MCP server</text>
  <rect x="650" y="332" width="78" height="22" rx="11" fill="#2b4a6c"/>
  <text x="689" y="347" text-anchor="middle" fill="#c1d8f4" font-size="10" font-weight="600" letter-spacing=".8">OPTIONAL</text>
  <text x="454" y="380" class="small">14 tools · 11 resources · 3 prompts</text>
  <rect x="656" y="362" width="68" height="26" rx="8" fill="#0b2038" stroke="#315b84"/>
  <text x="690" y="380" text-anchor="middle" class="mono blue">:8021</text>

  <!-- Primary API, Office conversion, layout, and CPU RAG chunker. -->
  <rect x="72" y="438" width="676" height="116" rx="20" stroke="#4b9af0" stroke-opacity=".10" stroke-width="7"/>
  <rect x="76" y="442" width="668" height="108" rx="16" fill="url(#api-fill)" stroke="url(#api-stroke)" stroke-width="1.2"/>
  <rect x="94" y="461" width="42" height="42" rx="12" fill="#255a91"/>
  <use href="#api-icon" x="101" y="466" color="#d8edff"/>
  <text x="152" y="480" class="heading" font-size="27" letter-spacing="-.4">Document Manager API</text>
  <text x="152" y="503" class="mono" fill="#9cc7f1">smart-document-manager (ocr-api)</text>
  <text x="152" y="530" class="body" style="fill: #c5daf0; font-size: 14px">PDF / Office / image parse · element OCR · CPU RAG chunking · console</text>
  <rect x="656" y="460" width="68" height="26" rx="8" fill="#0b2038" stroke="#315b84"/>
  <text x="690" y="478" text-anchor="middle" class="mono blue">:8020</text>

  <!-- Local GPU model execution. -->
  <rect x="72" y="598" width="676" height="114" rx="20" stroke="#4b9af0" stroke-opacity=".10" stroke-width="7"/>
  <rect x="76" y="602" width="668" height="106" rx="16" fill="url(#vllm-fill)" stroke="url(#vllm-stroke)" stroke-width="1.2"/>
  <rect x="94" y="621" width="42" height="42" rx="12" fill="#24527f"/>
  <use href="#chip-icon" x="100" y="627" color="#cfe6ff"/>
  <text x="152" y="639" class="heading" font-size="26" letter-spacing="-.4">PaddleOCR-VL Server</text>
  <text x="152" y="662" class="mono" fill="#a4c6e6">vllm-paddleocr</text>
  <text x="152" y="688" class="body" style="font-size: 14px">Local GPU VLM · PaddleOCR-VL-1.6 · Stage-1 hardware tiering</text>
  <rect x="656" y="620" width="68" height="26" rx="8" fill="#0b2038" stroke="#3a628c"/>
  <text x="690" y="638" text-anchor="middle" class="mono blue">:8081</text>
  <text x="724" y="662" text-anchor="end" class="small">3 VRAM tiers · &lt;16 / 16 / 24 GB</text>

  <text x="64" y="728" class="eyebrow" style="font-size: 10px; letter-spacing: 1px">ONE COMPOSE · EVERY PORT ON 127.0.0.1</text>
  <text x="756" y="728" text-anchor="end" class="eyebrow" style="font-size: 10px; letter-spacing: 1px">NVIDIA GPU + CPU CHUNKER</text>

  <!-- Optional S3 archive profile managed via COMPOSE_PROFILES=storage. -->
  <text x="846" y="418" class="eyebrow" style="fill: #c4818f">OPTIONAL STORAGE PROFILE</text>
  <rect x="846" y="442" width="314" height="220" rx="16" fill="url(#storage-fill)" stroke="#7a3247"/>
  <rect x="864" y="461" width="42" height="42" rx="12" fill="#4d1628"/>
  <use href="#database-icon" x="870" y="467" color="#ff9aab"/>
  <text x="921" y="489" class="heading" font-size="26" letter-spacing="-.4">SeaweedFS S3</text>
  <text x="870" y="532" class="body">Persistent output archive</text>
  <text x="870" y="558" class="body">Admin · Writer · Browser · Reader IAM</text>
  <line x1="870" y1="579" x2="1136" y2="579" stroke="#4a2029"/>
  <text x="870" y="606" class="rose" font-size="14" font-weight="600">storage-gateway</text>
  <rect x="1068" y="588" width="68" height="26" rx="8" fill="#241019" stroke="#7a3247"/>
  <text x="1102" y="606" text-anchor="middle" class="mono rose">:8333</text>
  <text x="870" y="637" class="small" style="fill: #bf94a0">COMPOSE_PROFILES=storage</text>
  <text x="846" y="689" class="small">Provisioned by storage-init.</text>
  <text x="846" y="710" class="small">Retains JSON, Markdown &amp; chunks.</text>

  <!-- A compact reading guide for the document pipeline sequence. -->
  <rect x="40" y="762" width="1120" height="62" rx="14" fill="#111f31" stroke="#263a52"/>
  <text x="62" y="798" class="eyebrow" style="fill: #b0c4dc">ONE PIPELINE</text>
  <line x1="176" y1="780" x2="176" y2="806" stroke="#31475f"/>
  <circle cx="206" cy="793" r="12" fill="#203d60"/>
  <text x="206" y="797" text-anchor="middle" font-size="11" font-weight="600" fill="#a8d4ff">1</text>
  <text x="228" y="798" class="body" style="fill: #d4e1f2">Ingest PDF / Office / image</text>
  <use href="#step-arrow" x="434" y="793"/>
  <circle cx="484" cy="793" r="12" fill="#203d60"/>
  <text x="484" y="797" text-anchor="middle" font-size="11" font-weight="600" fill="#a8d4ff">2</text>
  <text x="506" y="798" class="body" style="fill: #d4e1f2">Layout + VLM OCR</text>
  <use href="#step-arrow" x="660" y="793"/>
  <circle cx="710" cy="793" r="12" fill="#203d60"/>
  <text x="710" y="797" text-anchor="middle" font-size="11" font-weight="600" fill="#a8d4ff">3</text>
  <text x="732" y="798" class="body" style="fill: #d4e1f2">Normalize + RAG chunk</text>
  <use href="#step-arrow" x="920" y="793"/>
  <circle cx="970" cy="793" r="12" fill="#203d60"/>
  <text x="970" y="797" text-anchor="middle" font-size="11" font-weight="600" fill="#a8d4ff">4</text>
  <text x="992" y="798" class="body" style="fill: #d4e1f2">Return or archive</text>
</svg>
